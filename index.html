<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Salma ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:"Poppins",sans-serif;

    background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.25),transparent 28%),
        radial-gradient(circle at 85% 80%,rgba(255,255,255,.2),transparent 30%),
        linear-gradient(135deg,#ff758c,#ff7eb3,#c471ed,#8e7dff);

    background-size:200% 200%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* PAGE */

.page{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    text-align:center;
}

.page.active{
    display:flex;
}

/* GLASS CARD */

.card{
    width:min(92vw,440px);
    max-height:92vh;
    overflow:auto;

    padding:38px 25px;

    border-radius:32px;

    background:rgba(255,255,255,.20);
    border:1px solid rgba(255,255,255,.45);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(40,0,40,.30),
        inset 0 1px 0 rgba(255,255,255,.65);

    animation:cardIn .8s cubic-bezier(.2,.8,.2,1);
}

.card::-webkit-scrollbar{
    width:0;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.92);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* FIRST PAGE */

.big-heart{
    width:110px;
    height:110px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:58px;

    background:rgba(255,255,255,.28);
    border:1px solid rgba(255,255,255,.55);

    box-shadow:
        0 15px 40px rgba(255,0,80,.2),
        inset 0 2px 12px rgba(255,255,255,.6);

    animation:heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.10);
    }
}

.small-title{
    color:rgba(255,255,255,.8);
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
}

h1{
    margin:10px 0 14px;

    font-family:"Great Vibes",cursive;
    font-size:52px;

    color:white;

    text-shadow:
        0 4px 20px rgba(100,0,50,.2);
}

.question{
    color:white;
    font-size:17px;
    line-height:1.8;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:14px;

    margin-top:28px;
}

button{
    border:0;
    outline:0;

    padding:13px 28px;

    border-radius:50px;

    font-family:"Poppins",sans-serif;
    font-size:14px;
    font-weight:500;

    cursor:pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

button:hover{
    transform:translateY(-4px) scale(1.04);
}

button:active{
    transform:scale(.95);
}

.yes{
    color:white;

    background:
        linear-gradient(135deg,#ff1744,#ff5c8a);

    box-shadow:
        0 12px 30px rgba(255,0,80,.40);
}

.no{
    color:#777;
    background:rgba(255,255,255,.88);
}

/* FLOWER PAGE */

.flower-title{
    color:white;
    font-size:21px;
    font-weight:500;

    margin-bottom:8px;
}

.flower-subtitle{
    color:rgba(255,255,255,.75);
    font-size:12px;

    margin-bottom:15px;
}

.flower-area{
    height:300px;

    position:relative;
    overflow:hidden;

    border-radius:25px;

    background:rgba(255,255,255,.08);
}

.flower{
    position:absolute;
    bottom:-70px;

    animation:flowerUp linear forwards;

    pointer-events:none;
}

@keyframes flowerUp{

    0%{
        transform:
            translateY(0)
            rotate(0deg)
            scale(.4);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-380px)
            rotate(360deg)
            scale(1.25);

        opacity:0;
    }
}

/* NEXT */

.next{
    margin-top:20px;

    color:#d6336c;

    background:white;

    font-weight:600;

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);
}

/* PHOTO PAGE */

.photo-title{
    color:white;

    font-family:"Great Vibes",cursive;

    font-size:40px;

    margin-bottom:5px;
}

.photo-subtitle{
    color:rgba(255,255,255,.75);

    font-size:12px;

    margin-bottom:20px;
}

.photos{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.photo{
    display:block;

    width:100%;
    height:175px;

    object-fit:cover;

    border-radius:20px;

    border:3px solid rgba(255,255,255,.7);

    box-shadow:
        0 10px 25px rgba(0,0,0,.20);

    animation:photoIn .7s ease both;

    background:rgba(255,255,255,.15);
}

.photo:nth-child(2){
    animation-delay:.12s;
}

.photo:nth-child(3){
    animation-delay:.24s;
}

.photo:nth-child(4){
    animation-delay:.36s;
}

@keyframes photoIn{
    from{
        opacity:0;
        transform:scale(.75) rotate(-4deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

/* NOTE */

.note{
    position:relative;

    padding:34px 24px 28px;

    background:
        linear-gradient(
            rgba(255,255,255,.95),
            rgba(255,250,242,.95)
        );

    border-radius:8px;

    color:#49313b;

    text-align:left;

    box-shadow:
        0 25px 60px rgba(0,0,0,.25);

    transform:rotate(-1deg);

    overflow:hidden;
}

.note::before{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:8px;

    background:
        linear-gradient(
            90deg,
            #ff4d6d,
            #ff9a9e,
            #c471ed
        );
}

.note::after{
    content:"";

    position:absolute;

    width:100px;
    height:100px;

    right:-40px;
    bottom:-45px;

    border-radius:50%;

    background:rgba(255,120,160,.08);
}

.note h2{
    text-align:center;

    font-family:"Great Vibes",cursive;

    font-size:42px;

    color:#d6336c;

    margin-bottom:20px;
}

.note p{
    font-family:"Poppins",sans-serif;

    font-size:13.5px;

    line-height:2;

    color:#59414c;
}

.signature{
    margin-top:22px;

    text-align:right;

    font-family:"Great Vibes",cursive;

    font-size:30px;

    color:#d6336c;
}

/* FLOATING */

.floating{
    position:fixed;

    bottom:-40px;

    pointer-events:none;

    z-index:999;

    animation:floatUp linear forwards;
}

@keyframes floatUp{

    from{
        transform:
            translateY(0)
            rotate(0deg)
            scale(.7);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{
        transform:
            translateY(-115vh)
            rotate(360deg)
            scale(1.3);

        opacity:0;
    }
}

/* MUSIC */

.music{
    position:fixed;

    top:18px;
    right:18px;

    width:44px;
    height:44px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:white;

    background:rgba(255,255,255,.20);

    border:1px solid rgba(255,255,255,.4);

    backdrop-filter:blur(10px);

    z-index:9999;

    font-size:18px;
}

/* MOBILE */

@media(max-width:480px){

    .card{
        padding:30px 18px;
    }

    h1{
        font-size:45px;
    }

    .big-heart{
        width:95px;
        height:95px;
        font-size:50px;
    }

    .flower-area{
        height:270px;
    }

    .photo{
        height:145px;
    }

    .note{
        padding:32px 20px 25px;
    }

    .note
